<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7f2">
  <title>기울여라! — 센서 미로</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="기울여라 홈"><span class="brand-mark">◉</span> 기울여라!</a>
      <button class="language-button" id="language-button" type="button" aria-label="Switch to English">English</button>
    </header>

    <section class="game-layout" aria-labelledby="game-title">
      <div class="intro">
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="game-title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="status-row">
          <span class="sensor-dot" id="sensor-dot"></span>
          <span id="sensor-status" aria-live="polite">센서 연결 전</span>
          <span class="status-divider">·</span>
          <span id="move-count">이동 0</span>
        </div>
        <div class="actions">
          <button class="primary-button" id="sensor-button" type="button"></button>
          <button class="text-button" id="reset-button" type="button"></button>
        </div>
        <p class="hint"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd><span id="keyboard-hint"></span></p>
      </div>

      <div class="board-wrap">
        <div class="board-label"><span id="level-number">LEVEL 01 / 03</span><span id="level-name">초록 정원</span></div>
        <div class="board" id="board" role="img" aria-label="벽을 피해 공을 목표까지 움직이는 미로">
          <div class="goal"><span>★</span></div>
          <div class="ball" id="ball"><span></span></div>
          <div class="finish-message" id="finish-message" aria-live="polite">
            <span class="finish-icon">✦</span><strong id="finish-title"></strong><span id="finish-caption"></span>
            <button id="play-again" type="button"></button>
          </div>
        </div>
        <div class="board-footer"><span id="start-label">START <i></i></span><span id="finish-label">FINISH <i>★</i></span></div>
      </div>
    </section>

    <footer class="footer"><span id="footer-tagline"></span><span id="footer-device"></span></footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
